
services:
  postgres:
    image: postgres:16-alpine
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore_dev_password
      POSTGRES_DB: bookstore_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bookstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookstore_pgdata:

